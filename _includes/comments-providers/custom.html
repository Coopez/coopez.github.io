<!-- start custom comments snippet: giscus, themed to follow the site's theme toggle -->
<!-- Static <script> is required: giscus finds its mount via document.currentScript,
     which is null for scripts inserted by JS. -->
<script src="https://giscus.app/client.js"
        data-repo="coopez/coopez.github.io"
        data-repo-id="R_kgDOThNEig"
        data-category="Announcements"
        data-category-id="DIC_kwDOThNEis4DB45a"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="light_tritanopia"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>

<script>
(function () {
  function giscusTheme() {
    var t = localStorage.getItem("theme");
    var dark = (t === "dark") ? true
      : (t === "light") ? false
      : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    return dark ? "gruvbox_dark" : "light_tritanopia";
  }

  // Poll for the site theme and, when it changes, reload the giscus iframe with
  // the new theme via its src. Robust: doesn't rely on the postMessage setConfig
  // path (which silently no-ops in some deployed environments).
  var applied = null;
  setInterval(function () {
    var theme = giscusTheme();
    if (theme === applied) return;
    var frame = document.querySelector("iframe.giscus-frame");
    if (!frame || !frame.src) return;              // giscus not mounted yet
    var url;
    try { url = new URL(frame.src); } catch (e) { return; }
    if (url.searchParams.get("theme") !== theme) {
      url.searchParams.set("theme", theme);
      frame.src = url.toString();                  // reloads giscus in the new theme
    }
    applied = theme;
  }, 500);
})();
</script>
<!-- end custom comments snippet -->
