<!-- start custom comments snippet: giscus, themed to follow the site's theme toggle -->
<!-- Static <script> is required: giscus finds its mount via document.currentScript,
     which is null for scripts inserted by JS. -->
<script src="https://giscus.app/client.js"
        data-repo="coopez/coopez.github.io"
        data-repo-id="R_kgDOThNEig"
        data-category="Announcements"
        data-category-id="DIC_kwDOThNEis4DB45a"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="{{ '/assets/css/giscus-light.css' | absolute_url }}"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>

<script>
(function () {
  var GISCUS_ORIGIN = "https://giscus.app";

  /* Self-hosted custom themes that mirror the site's light/dark palette.
     Absolute URLs are required: the giscus iframe is cross-origin, so a
     root-relative path would resolve against giscus.app, not this site. */
  var THEME_DARK = "{{ '/assets/css/giscus-dark.css' | absolute_url }}";
  var THEME_LIGHT = "{{ '/assets/css/giscus-light.css' | absolute_url }}";

  function giscusTheme() {
    var t = localStorage.getItem("theme");
    var dark = (t === "dark") ? true
      : (t === "light") ? false
      : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    return dark ? THEME_DARK : THEME_LIGHT;
  }

  /* Live-theme giscus via its documented setConfig message (no iframe reload).
     NOTE: block comments only in this <script> — the site's HTML minifier
     collapses newlines, which turns any // line comment into a swallow-the-
     rest-of-the-script comment. That silently killed every earlier attempt. */
  function pushTheme() {
    var frame = document.querySelector("iframe.giscus-frame");
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage(
      { giscus: { setConfig: { theme: giscusTheme() } } }, GISCUS_ORIGIN);
  }

  /* Delivery is timing-sensitive: a setConfig sent before giscus finishes loading
     is silently dropped. giscus only posts a message once it's live and listening,
     so (re)assert the current theme on every message from it — this guarantees at
     least one setConfig lands after the widget is ready, and re-corrects reloads. */
  window.addEventListener("message", function (e) {
    if (e.origin === GISCUS_ORIGIN && e.data && e.data.giscus) pushTheme();
  });

  /* Follow the site toggle, which flips <html data-theme>. */
  new MutationObserver(pushTheme).observe(
    document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
<!-- end custom comments snippet -->
